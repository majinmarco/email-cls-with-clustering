[project]
name = "email-cls-with-clustering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marco Nardone Guerra", email = "m.nardoneguerra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "openai>=3.19.1",
    "pandas>=3.0.6",
    "pyspellchecker>=0.9.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scikit-learn-extra>=0.3.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "talon>=1.4.4",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
]

[project.scripts]
email-cls-with-clustering = "email_cls_with_clustering:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.14"
