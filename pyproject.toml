[project]
name = "email-cls-with-clustering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marco Nardone Guerra", email = "m.nardoneguerra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bertopic>=0.17.0",
    "datasketch>=1.6.5",
    "einops>=0.8.2",
    "gensim>=4.4.0",
    "hdbscan>=0.8.40",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "openai>=3.19.1",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pyspellchecker>=0.9.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scikit-learn-extra>=0.3.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.0",
    "talon>=1.4.4",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "tqdm>=4.67.0",
    "umap-learn>=0.5.9",
]

[project.scripts]
email-cls-with-clustering = "email_cls_with_clustering:main"
preprocess-emails = "email_cls_with_clustering.commands.preprocess:main"
topic-model-emails = "email_cls_with_clustering.commands.topic_model:main"
topic-model-hpo = "email_cls_with_clustering.commands.hpo:main"
run-email-pipeline = "email_cls_with_clustering.commands.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.14"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
